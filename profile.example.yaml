# Your own answers to recurring custom questions. `match` is a regex tested against the field label.
answer_bank:
  - match: "(prefer|strong|best|favou?rite).*programming language|programming language.*(prefer|strong|best|favou?rite)"
    answer: Python
  - match: "gdpr|data protection"
    answer: I am familiar with GDPR principles from handling customer data in my current role.

