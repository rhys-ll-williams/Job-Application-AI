# UK equal-opportunities monitoring. EVERYTHING defaults to prefer_not_to_say.
# Only change a value if you are happy for it to be entered on forms; the bot
# never infers any of these from your CV or name. Use the wording a form would use,
# e.g. ethnicity: "Asian or Asian British - Indian", gender: "Woman", disability: "No".
demographics:
  gender: prefer_not_to_say
  gender_same_as_birth: prefer_not_to_say
  ethnicity: prefer_not_to_say
  sexual_orientation: prefer_not_to_say
  religion: prefer_not_to_say
  disability: prefer_not_to_say
  age_range: prefer_not_to_say
  date_of_birth: ""               # only entered if a form insists on a date and this is set (YYYY-MM-DD)
  marital_status: prefer_not_to_say
  caring_responsibilities: prefer_not_to_say
  veteran: prefer_not_to_say
  pregnancy_or_maternity: prefer_not_to_say
  socio_economic_background: prefer_not_to_say
  school_type: prefer_not_to_say
  free_school_meals: prefer_not_to_say
  first_generation_university: prefer_not_to_say
  disability_adjustments: ""      # blank = none requested. Write what you need if you want it stated.

