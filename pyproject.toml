[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobbot"
version = "0.1.0"
description = "Local LLM (Ollama / Qwen) job application agent"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.45", "httpx>=0.27", "pydantic>=2.6", "PyYAML>=6.0",
  "Jinja2>=3.1", "rapidfuzz>=3.6", "rich>=13.7", "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobbot = "jobbot.cli:main"

[tool.setuptools]
packages = ["jobbot", "jobbot.forms", "jobbot.cv", "jobbot.sources"]

[tool.setuptools.package-data]
"jobbot.forms" = ["extract.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
